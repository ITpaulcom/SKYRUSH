# Cloud-Builds für iOS und Android ohne eigenen Mac (codemagic.io, kostenloses Kontingent reicht für den Start).
# Vorher in Codemagic anlegen: App-Store-Connect-API-Schlüssel (Integration "app_store_connect"),
# Android-Upload-Keystore (Code signing identities → Android keystores, Referenz "skyrush_upload"),
# Google-Play-Service-Account als Variable GCLOUD_SERVICE_ACCOUNT_CREDENTIALS in der Gruppe "google_play".
workflows:
  ios-release:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: app_store_connect
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.itpaul.skyrush
    scripts:
      - name: Abhängigkeiten
        script: npm ci
      - name: Kern testen
        script: npm test
      - name: Web-Code in iOS übernehmen
        script: npm run sync
      - name: Signierung
        script: xcode-project use-profiles
      - name: Build-Nummer
        script: agvtool new-version -all $BUILD_NUMBER
        working_directory: ios/App
      - name: IPA bauen
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-release:
    name: Android → Play (interner Test)
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      node: 22
      java: 21
      android_signing:
        - skyrush_upload
      groups:
        - google_play
    scripts:
      - name: Abhängigkeiten
        script: npm ci
      - name: Kern testen
        script: npm test
      - name: Web-Code in Android übernehmen
        script: npm run sync
      - name: App-Bundle bauen
        script: cd android && ./gradlew bundleRelease -PversionCode=$BUILD_NUMBER
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
