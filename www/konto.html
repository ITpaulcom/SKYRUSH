<title>Sky Duell – Spielstand sichern</title>
<link rel="icon" href="icons/icon-192.png">
<style>
@font-face{font-family:'Space Grotesk';font-weight:700;font-display:swap;src:url(fonts/space-grotesk-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Space Grotesk';font-weight:500;font-display:swap;src:url(fonts/space-grotesk-latin-500-normal.woff2) format('woff2')}
:root{--ink:#1B1240;--paper:#FFF8EC;--sun:#FFC83D;--mint:#3BE8A4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(180deg,#2A1B5C,#7B4DFF 55%,#FF9AA8);color:var(--ink);font:16px/1.5 'Space Grotesk',system-ui,sans-serif}
.card{width:100%;max-width:420px;background:var(--paper);border:3px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:26px 22px 22px;text-align:center}
.logo{font-weight:700;font-size:44px;line-height:.85;letter-spacing:-.04em;margin:0 0 14px}.logo b{display:block;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}.logo b+b{color:var(--sun);transform:rotate(-3deg)}
h1{font-size:24px;margin:6px 0 8px}
p{margin:8px 0}
.small{font-size:13px;opacity:.75}
#gbtn{display:flex;justify-content:center;min-height:48px;margin:18px 0 8px}
.msg{border:3px solid var(--ink);border-radius:16px;padding:12px 14px;margin:14px 0 4px;font-weight:700;background:#fff}
.msg.ok{background:#E3FFF0}.msg.warn{background:#FFF6D6}.msg.bad{background:#FFE1E7}
a{color:var(--ink);font-weight:700}
.hint{font-weight:700;margin:14px 0 4px}
.btn{display:inline-block;margin-top:10px;padding:11px 18px;border:3px solid var(--ink);border-radius:14px;background:var(--sun);box-shadow:0 4px 0 var(--ink);text-decoration:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
  <div class="logo" aria-label="Sky Duell" translate="no"><b>SKY</b><b>DUELL</b></div>
  <h1 id="h"></h1>
  <p id="intro"></p>
  <div id="gbtn"></div>
  <div class="msg" id="msg" hidden></div>
  <a class="btn" id="back" href="/" hidden></a>
  <p class="hint" id="hint" hidden></p>
  <p class="small" id="note"></p>
</main>
