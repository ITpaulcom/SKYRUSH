<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Sky Rush – Zentrale</title>
<style>
  :root{--ink:#1B1240;--paper:#FFF8EC;--card:#fff;--sun:#FFC83D;--mint:#3BE8A4;--coral:#FF5A7A;--sky:#38C6FF;--grape:#7B4DFF;--line:#ECE3D3;--muted:#6b6386;--ok:#0B8F5A;--bad:#D3264E}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  button,input,select{font:inherit;color:inherit}
  a{color:inherit}
  .muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}
  .btn{font-weight:700;padding:8px 14px;border:2px solid var(--ink);border-radius:11px;background:var(--sun);cursor:pointer;box-shadow:0 2px 0 var(--ink);white-space:nowrap}
  .btn:active{transform:translateY(2px);box-shadow:none}
  .btn.w{background:#fff}.btn.r{background:#FFE1E7;color:var(--bad);border-color:var(--bad);box-shadow:0 2px 0 var(--bad)}.btn.g{background:#D9FFEE}
  .btn.s{padding:4px 9px;font-size:13px;border-radius:9px}
  .btn[disabled]{opacity:.5;cursor:default}
  input,select{padding:8px 10px;border:2px solid var(--ink);border-radius:10px;background:#fff;min-width:0}
  input[type=number]{width:92px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .grow{flex:1;min-width:0}
  /* Anmeldung */
  #login{min-height:100vh;display:grid;place-items:center;padding:20px}
  #login .box{width:min(420px,100%);background:#fff;border:3px solid var(--ink);border-radius:22px;padding:26px;box-shadow:0 6px 0 var(--ink)}
  #login h1{margin:0 0 4px;font-size:26px}
  #login input{width:100%;margin:16px 0 10px;font-size:16px;padding:12px}
  #login .btn{width:100%;padding:12px;font-size:16px}
  #lmsg{min-height:22px;margin:12px 0 0;font-weight:700}
  #lmsg.bad{color:var(--bad)} #lmsg.lock{color:#fff;background:var(--bad);border-radius:10px;padding:10px 12px}
  /* Kopf + Navigation */
  header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff}
  header .in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center}
  header b{font-size:17px;white-space:nowrap}
  nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
  nav::-webkit-scrollbar{display:none}
  nav button{background:none;border:0;color:#cfc8ea;padding:8px 11px;border-radius:9px;cursor:pointer;font-weight:600;white-space:nowrap}
  nav button.on{background:var(--sun);color:var(--ink)}
  nav .cnt{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--coral);color:#fff;font-size:11px;margin-left:4px;text-align:center}
  header .out{background:none;border:2px solid #fff;color:#fff;border-radius:9px;padding:5px 10px;cursor:pointer;font-weight:700}
  main{max-width:1200px;margin:0 auto;padding:18px 16px 70px}
  h2{margin:4px 0 12px;font-size:22px} h3{margin:0 0 10px;font-size:16px}
  .card{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px 16px;margin-bottom:14px}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px 12px}
  .kpi span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
  th.sort{cursor:pointer} th.sort.on::after{content:' ▼'}
  tr.click{cursor:pointer} tr.click:hover td{background:#FFF4D6}
  .wrap{overflow-x:auto}
  .badge{display:inline-block;padding:1px 7px;border-radius:8px;font-size:11.5px;font-weight:700;border:1.5px solid currentColor}
  .badge.bad{color:var(--bad)} .badge.ok{color:var(--ok)} .badge.warn{color:#B36B00} .badge.info{color:#2E6FD8}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:5px 11px;border:2px solid var(--ink);border-radius:20px;background:#fff;cursor:pointer;font-weight:600;font-size:13.5px}
  .chip.on{background:var(--ink);color:#fff}
  .empty{padding:20px;text-align:center;color:var(--muted)}
  .pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px}
  .chart{display:flex;align-items:flex-end;gap:3px;height:160px;border-bottom:2px solid var(--ink);padding-top:10px;overflow-x:auto}
  .bar{flex:1;min-width:9px;display:flex;flex-direction:column-reverse;height:100%;position:relative}
  .bar i{display:block}
  .bar:hover::after{content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:4px 8px;border-radius:8px;white-space:nowrap;font-size:12px;z-index:2}
  .legend{display:flex;gap:14px;margin-top:8px;font-size:13px}
  .legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
  .podium{display:grid;gap:8px}
  .pod{display:flex;gap:10px;align-items:center;border:2px solid var(--ink);border-radius:12px;padding:8px 10px}
  .pod .m{font-size:24px}
  /* Spieler-Ansicht */
  #drawer{position:fixed;inset:0;z-index:40;display:none}
  #drawer.on{display:block}
  #drawer .bg{position:absolute;inset:0;background:rgba(27,18,64,.45)}
  #drawer .pane{position:absolute;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--paper);overflow-y:auto;border-left:3px solid var(--ink);box-shadow:-8px 0 30px rgba(0,0,0,.2)}
  #drawer .ph{position:sticky;top:0;z-index:2;background:var(--ink);color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center}
  #drawer .ph b{font-size:18px}
  #drawer .ph .x{margin-left:auto;background:none;border:2px solid #fff;color:#fff;border-radius:9px;padding:4px 10px;cursor:pointer;font-weight:700}
  #drawer .pb{padding:14px 16px 60px}
  .why{position:sticky;top:52px;z-index:1;background:#FFF1C9;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;margin-bottom:12px}
  .why input{width:100%}
  .vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .val{border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff}
  .val span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block}
  .val b{font-size:18px}
  .val .row{margin-top:6px}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{display:inline-flex;gap:6px;align-items:center;border:2px solid var(--ink);border-radius:10px;padding:3px 4px 3px 9px;background:#fff;font-size:13.5px;font-weight:600}
  .tag button{border:0;background:#FFE1E7;color:var(--bad);border-radius:7px;cursor:pointer;font-weight:900;padding:1px 7px}
  .tag.lock{background:#F2EEF9;color:var(--muted)}
  .chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
  .chars label{display:flex;gap:6px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:5px 8px;background:#fff;font-size:14px;cursor:pointer}
  .chars label.on{border-color:var(--ok);background:#E9FFF5}
  .danger{border-color:var(--bad)}
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;display:none;max-width:90vw}
  #toast.bad{background:var(--bad)}
  td.small,td.num,#ptab td{white-space:nowrap}
  /* Einstellungen */
  .form{display:grid;gap:10px}
  .fl{display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
  .fl:last-child{border-bottom:0}
  .fl>span b{display:block}.fl>span small{color:var(--muted)}
  .fl input[type=text]{width:100%}
  .sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600}
  .sw input{width:20px;height:20px;accent-color:var(--ink)}
  .prov{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
  .prov label{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--ink);border-radius:14px;padding:10px 12px;background:#fff;cursor:pointer}
  .prov label input{width:20px;height:20px;margin-top:2px;accent-color:var(--ink);flex:none}
  .prov label.off{opacity:.6;background:#F4F1FA}
  .savebar{position:sticky;bottom:12px;display:flex;gap:10px;align-items:center;justify-content:flex-end;background:#FFF1C9;border:2px solid var(--ink);border-radius:14px;padding:10px 12px;box-shadow:0 4px 0 var(--ink)}
  .ferr{outline:3px solid var(--bad)}
  .tblwrap{overflow-x:auto} .shoptbl input[type=number]{width:100px} .shoptbl tr.off td{opacity:.45} .shoptbl td.eff{white-space:nowrap} .shoptbl input[type=checkbox]{width:18px;height:18px}
  .links{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px} .links a{display:block;padding:10px 12px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);text-decoration:none;font-weight:700;box-shadow:0 2px 0 var(--ink)} .links a small{display:block;font-weight:400;color:var(--muted)}
  @media (max-width:640px){ .fl{grid-template-columns:1fr} }
  @media (max-width:640px){ header .in{flex-wrap:wrap} nav{order:3;flex-basis:100%} th,td{padding:7px 5px} .hide-s{display:none} }
</style>
</head>
<body>
<div id="login">
  <form class="box" id="lf" autocomplete="off">
    <h1>🔒 Zentrale</h1>
    <p class="muted small">Sky Rush · nur für dich. Nach 3 falschen Versuchen wird die Anmeldung von diesem Anschluss aus gesperrt.</p>
    <input id="key" type="password" placeholder="Zentrale-Schlüssel" autocomplete="off" spellcheck="false" required>
    <button class="btn" id="lbtn">Anmelden</button>
    <p id="lmsg"></p>
  </form>
</div>
<div id="app" hidden>
  <header><div class="in"><b>☁️ Sky Rush · Zentrale</b>
    <nav id="nav"></nav>
    <button class="out" id="out" title="Abmelden">Abmelden</button></div></header>
  <main id="main"></main>
</div>
<div id="drawer"><div class="bg" data-close></div><div class="pane"><div class="ph"><b id="dt">Spieler</b><span id="dbadges"></span><button class="x" data-close>✕ Schließen</button></div><div class="pb" id="db"></div></div></div>
<div id="toast"></div>
<script type="module">
import { CHARS, STYLE } from './catalog.js';
import { CHEST, TOUR_PRIZES, DAILY_TIERS, dailyTier } from './meta.js';

const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Number(n || 0).toLocaleString('de-DE');
const money = (v, c) => Number(v || 0).toLocaleString('de-DE', { style: 'currency', currency: c || 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dt = t => t ? new Date(t).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '–';
const ago = t => { if (!t) return '–'; const s = (Date.now() - t) / 1000; return s < 60 ? 'gerade' : s < 3600 ? `vor ${Math.floor(s / 60)} Min` : s < 86400 ? `vor ${Math.floor(s / 3600)} Std` : s < 86400 * 60 ? `vor ${Math.floor(s / 86400)} T` : dt(t); };
const flag = cc => cc && /^[A-Z]{2}$/.test(cc) ? String.fromCodePoint(...[...cc].map(c => 127397 + c.charCodeAt(0))) : '🏳';
const MEDAL = ['🥇', '🥈', '🥉'], POW = { jet: '🚀 Jetpack', magnet: '🧲 Magnet', shield: '🛡️ Schild', boots: '👟 Sprungschuhe' };
const toast = (m, bad = false) => { const t = $('toast'); t.textContent = m; t.className = bad ? 'bad' : ''; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3200); };
try { localStorage.removeItem('skyrush.admin'); } catch {}   // alter Speicherort des Schlüssels – wird nicht mehr benutzt

// ---------- Anmeldung / Sitzung ----------
let TOKEN = ''; try { TOKEN = sessionStorage.getItem('skyrush.adm') || ''; } catch {}
async function api(qs = '', body = null) {
  const r = await fetch('/api/admin' + qs, { method: body ? 'POST' : 'GET', headers: { authorization: 'Bearer ' + TOKEN, ...(body ? { 'content-type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' }).catch(() => null);
  if (!r) throw new Error('Server nicht erreichbar');
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin('Sitzung abgelaufen – bitte neu anmelden.'); throw new Error('auth'); }
  if (!r.ok) throw Object.assign(new Error(j.error || 'Fehler ' + r.status), { j });
  return j;
}
function showLogin(msg = '') { TOKEN = ''; try { sessionStorage.removeItem('skyrush.adm'); } catch {} $('app').hidden = true; $('drawer').classList.remove('on'); $('login').hidden = false; $('lmsg').textContent = msg; $('lmsg').className = msg ? 'bad' : ''; $('key').value = ''; $('key').focus(); }
$('lf').onsubmit = async e => {
  e.preventDefault();
  const key = $('key').value.trim(); if (!key) return;
  $('lbtn').disabled = true; $('lmsg').textContent = 'Prüfe …'; $('lmsg').className = '';
  const r = await fetch('/api/admin', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'login', key }) }).catch(() => null);
  const j = r ? await r.json().catch(() => ({})) : {};
  $('lbtn').disabled = false; $('key').value = '';
  if (r && r.ok && j.token) { TOKEN = j.token; try { sessionStorage.setItem('skyrush.adm', TOKEN); } catch {} $('login').hidden = true; $('app').hidden = false; go(location.hash.slice(1) || 'dash'); return; }
  const m = $('lmsg');
  if (!r) { m.textContent = 'Server nicht erreichbar.'; m.className = 'bad'; }
  else if (j.error === 'locked') { m.textContent = `🔒 Gesperrt bis ${dt(j.until)}${j.all ? ' (zu viele Fehlversuche insgesamt)' : ''}. Sofort wieder frei: neuen Schlüssel erzeugen und deployen.`; m.className = 'lock'; }
  else if (j.error === 'nokey') { m.textContent = 'Auf dem Server ist kein (sicherer) Schlüssel gesetzt. im Projektordner „SKY-RUSH-ZENTRALE-SCHLUESSEL.bat“ ausführen.'; m.className = 'bad'; }
  else { m.textContent = `Falscher Schlüssel. Noch ${j.left} Versuch${j.left === 1 ? '' : 'e'}, dann wird gesperrt.`; m.className = 'bad'; }
};
$('out').onclick = async () => { try { await api('', { action: 'logout' }); } catch {} showLogin('Abgemeldet.'); };

// ---------- Navigation ----------
const VIEWS = { dash: 'Übersicht', players: 'Spieler', boards: 'Ranglisten', ac: 'Anti-Cheat', ads: 'Werbung', shop: 'Shop', cfg: 'Einstellungen', log: 'Protokoll', sec: 'Sicherheit' };
let VIEW = 'dash', DASH = null, PLAYERS = null;
function navRender(counts = {}) { $('nav').innerHTML = Object.entries(VIEWS).map(([k, v]) => `<button data-v="${k}" class="${k === VIEW ? 'on' : ''}">${v}${counts[k] ? `<span class="cnt">${counts[k]}</span>` : ''}</button>`).join(''); }
$('nav').onclick = e => { const b = e.target.closest('[data-v]'); if (b) go(b.dataset.v); };
async function go(v) {
  if (!VIEWS[v]) v = 'dash'; VIEW = v; history.replaceState(null, '', '#' + v); navRender(go.counts);
  $('main').innerHTML = '<p class="muted">Lädt …</p>';
  try { await ({ dash: vDash, players: vPlayers, boards: vBoards, ac: vAc, ads: vAds, shop: vShop, cfg: vCfg, log: vLog, sec: vSec })[v](); }
  catch (e) { if (e.message !== 'auth') $('main').innerHTML = `<p class="card" style="color:var(--bad)">Fehler: ${esc(e.message)}</p>`; }
}
const loadDash = async (force = false) => (DASH && !force ? DASH : (DASH = await api('?view=dash&days=30')));
const loadPlayers = async (force = false) => (PLAYERS && !force ? PLAYERS : (PLAYERS = (await api('?view=players')).players));
const WHY = { fast: 'schneller als Echtzeit (Speedhack/Bot)', slow: 'Zeitlupe', burst: 'übermenschlich schnelle Eingaben', score: 'falsche Punktzahl gemeldet', save: 'Spielstand verändert', hit: 'Kollision gefälscht (Duell)', seeds: 'viele abgebrochene Starts', 'iap-unverified': 'Kauf ohne Server-Prüfung (RevenueCat-Secret fehlt)' };
const why = w => String(w).split(',').map(x => WHY[x] || (x.startsWith('replay') ? 'Lauf nicht nachspielbar (manipuliert)' : x.startsWith('burst') ? 'sehr schnelle Eingaben (' + esc(x.slice(5)) + '/s)' : x.startsWith('top') ? 'Platz ' + esc(x.slice(3)) + ' erreicht' : x.startsWith('init:') ? 'Spielstand übernommen, teils gekürzt (' + esc(x.slice(5)) + ')' : x.startsWith('restored:') ? '✅ Spielstand wiederhergestellt (' + esc(x.slice(9)) + ')' : x.startsWith('admin-h:') ? '✅ Rekord bestätigt: ' + esc(x.slice(8)) + ' m' : x.startsWith('admin-lv:') ? '✅ Stufen zurückgegeben: ' + esc(x.slice(9)) : x.startsWith('tourprize:') ? '🏆 Turnierpreis ausgezahlt: Platz ' + esc(x.slice(10)) : esc(x))).join(' · ');
const sev = w => /replay|fast|slow|burst|score|save|hit|rejected/.test(w) ? 'bad' : /top|seeds|iap/.test(w) ? 'warn' : 'ok';
const nameCell = (n, c, uid) => `<a href="#" data-p="${esc(uid)}" style="white-space:nowrap">${c ? flag(c) + ' ' : ''}${esc(n || 'Spieler')}</a>`;
document.addEventListener('click', e => { const a = e.target.closest('[data-p]'); if (a) { e.preventDefault(); openPlayer(a.dataset.p); } });

// ---------- Übersicht ----------
const LINKS = [
  ['Google Play Console', 'https://play.google.com/console/u/0/developers/7829093855860564632/app/4976021817400735669/app-dashboard', 'Tests, Versionen, Produkte'],
  ['AdMob', 'https://admob.google.com/v2/home', 'Werbung & Einnahmen'],
  ['RevenueCat', 'https://app.revenuecat.com/', 'Käufe & Kunden'],
  ['Microsoft Partner Center', 'https://partner.microsoft.com/dashboard/apps-and-games/overview', 'Windows-Store'],
  ['Netlify', 'https://app.netlify.com/', 'Hosting & Deploys'],
  ['Spiel öffnen', 'https://myskyrush.com/', 'myskyrush.com'],
];
async function vDash() {
  const [d, pl] = await Promise.all([loadDash(true), loadPlayers(true)]);
  const now = Date.now(), cur = (d.days.find(x => x.impressions) || {}).currency || 'USD', sum = n => d.days.slice(0, n).reduce((a, x) => a + x.revenue, 0);
  const act1 = pl.filter(p => now - (p.at || 0) < 864e5).length, act7 = pl.filter(p => now - (p.at || 0) < 7 * 864e5).length, new1 = pl.filter(p => now - (p.cr || 0) < 864e5).length;
  const fl24 = d.flags.filter(f => now - f.at < 864e5 && sev(f.why) !== 'ok').length, bans = Object.keys(d.bans || {}).length;
  go.counts = { ac: fl24 }; navRender(go.counts);
  const tp = d.boards.tourPrev, wait = (tp.top || []).filter(e => e.prize === 'waiting').length;
  $('main').innerHTML = `<h2>Übersicht</h2>
    <div class="kpis">${[['Spieler', fmt(pl.length)], ['Aktiv heute', fmt(act1)], ['Aktiv 7 Tage', fmt(act7)], ['Neu heute', fmt(new1)], ['Umsatz heute', money(d.days[0].revenue, cur)], ['Umsatz 30 Tage', money(sum(30), cur)], ['Mit Google gesichert', fmt(pl.filter(p => p.g).length)], ['Auffällig (24 Std)', fmt(fl24)], ['Gesperrt', fmt(bans)]].map(([k, v]) => `<div class="kpi"><span>${k}</span><b>${v}</b></div>`).join('')}</div>
    <div class="grid">
      <div class="card"><h3>🏆 Turnier ${esc(tp.period)} – Preise</h3>${podium(tp)}</div>
      <div class="card"><h3>☀️ Tages-Run ${esc(d.boards.dailyPrev.period)} – Auswertung</h3>${podium(d.boards.dailyPrev, true)}</div>
      <div class="card"><h3>⚠️ Zuletzt auffällig</h3>${flagTable(d.flags.filter(f => sev(f.why) !== 'ok').slice(0, 6), true)}<div class="row" style="margin-top:8px"><button class="btn w s" onclick="location.hash='ac'">Alle ansehen</button></div></div>
      <div class="card"><h3>⭐ Neueste Spieler</h3>${playerMini(pl.slice().sort((a, b) => (b.cr || 0) - (a.cr || 0)).slice(0, 6))}</div>
      <div class="card"><h3>🔥 Gerade aktiv</h3>${playerMini(pl.slice().sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 6))}</div>
    </div>
    <div class="card"><h3>🔗 Schnellzugriff</h3><div class="links">${LINKS.map(([n, u, t]) => `<a href="${u}" target="_blank" rel="noopener">${n}<small>${t}</small></a>`).join('')}</div>
      <p class="small muted" style="margin:8px 0 0">Werbe-IDs (AdMob, AdSense, Häufigkeit) änderst du unter <b>Einstellungen</b>, Preise und Rabatte unter <b>Shop</b>.</p></div>`;

    if (k === 'coins') { const n = num('coN'); if (!n && mode !== 'set') return toast('Menge eingeben', true); return op({ kind: 'coins', mode, n }, mode === 'sub' ? `${fmt(n)} Münzen abziehen?` : mode === 'set' ? `Münzen auf ${fmt(n)} setzen?` : ''); }
    if (k === 'height') { const h = num('hN'); return op({ kind: 'height', h }, h < s.bestH ? `Rekord auf ${fmt(h)} m senken? Höhen-Figuren über diesem Wert werden entfernt.` : ''); }
    if (k === 'level') return op({ kind: 'level', n: num('lN') });
    if (k === 'mult') return op({ kind: 'mult', n: num('mN') }, 'Multiplikator ändern? Die Missionen werden dabei neu gesetzt.');
    if (k === 'tokens') return op({ kind: 'tokens', n: num('tN') });
    if (k === 'levels') { const lv = Object.fromEntries(Object.keys(POW).map(x => [x, Math.min(15, num('lv-' + x))])); const down = Object.keys(lv).some(x => lv[x] < (s.levels[x] || 0)); return op({ kind: 'levels', lv }, down ? 'Stufen herabsetzen?' : ''); }
    if (k === 'chestAdd') return op({ kind: 'chestAdd', type: $('chT').value, n: Math.max(1, num('chN')) });
    if (k === 'chestAll') return op({ kind: 'chestDel', all: true }, 'Alle Truhen entfernen?');
    if (k === 'prize') return op({ kind: 'prize', p: $('pzW').value.trim(), pl: +$('pzP').value }, `Turnierpreis Platz ${$('pzP').value} für ${$('pzW').value.trim()} vergeben?`);
    if (k === 'styleAdd') { if (!$('stK').value) return; return op({ kind: 'styleAdd', key: $('stK').value }); }
    if (k === 'dprize') { const r = num('dzR'), n = Math.max(r, num('dzN')), t = dailyTier(r, n); return op({ kind: 'dprize', d: $('dzD').value.trim(), r, n }, `Tagesauswertung ${$('dzD').value.trim()} vergeben: Platz ${r} von ${n} → ${fmt(t.coins)} Münzen + ${CHEST[t.chest].name}?`); }
    if (k === 'reset') { const n = prompt(`Zum Bestätigen den Namen eintippen: ${CUR.player && CUR.player.name}`); if (n !== (CUR.player && CUR.player.name)) return toast('Abgebrochen', true); return op({ kind: 'reset' }); }
  }
  const cd = t.closest('[data-chdel]'); if (cd) return op({ kind: 'chestDel', i: +cd.dataset.chdel }, 'Diese Truhe entfernen?');
  const sd = t.closest('[data-sdel]'); if (sd) return op({ kind: 'styleDel', key: sd.dataset.sdel }, 'Dieses Style-Teil wegnehmen?');
  const dd = t.closest('[data-ddel]'); if (dd) return op({ kind: 'dprizeDel', d: dd.dataset.ddel, revoke: !!dd.dataset.rev }, dd.dataset.rev ? 'Tagesbelohnung zurücknehmen? Münzen werden abgezogen und die Truhe (falls noch zu) entfernt.' : 'Nur den Eintrag entfernen (Belohnung bleibt)?');
  const wd = t.closest('[data-wdel]'); if (wd) return op({ kind: 'prizeDel', p: wd.dataset.wdel, revoke: !!wd.dataset.rev }, wd.dataset.rev ? 'Preis zurücknehmen? Münzen werden abgezogen, die Truhe (falls noch zu) und der Siegerkranz entfernt.' : 'Nur den Pokal entfernen (Preise bleiben)?');
});
$('db').addEventListener('change', e => { const c = e.target.closest('[data-char]'); if (!c) return; const k = c.dataset.char; op({ kind: c.checked ? 'charAdd' : 'charDel', k }, c.checked ? '' : `${CHARS[k].name} wegnehmen?${CHARS[k].unlock ? ' Der Rekord wird dafür unter ' + fmt(CHARS[k].unlock) + ' m gesetzt.' : ''}`).then(() => { if (CUR) renderPlayer(); }); });

      <div class="fl"><span><b>Bis</b><small>leer = bis du sie beendest</small></span><span><input type="datetime-local" id="sl-until" value="${toLocal(sl.until)}"></span></div>
      <p class="small muted" style="margin:4px 0 0">Im Spiel erscheinen durchgestrichene Preise und ein „−20 %“-Abzeichen. Preise werden auf 10 Münzen gerundet.</p></div></div>
    ${Object.entries(groups).map(([cat, list]) => `<div class="card"><h3>${esc(d.cats[cat] || cat)} <small class="muted">${list.length}</small></h3><div class="tblwrap"><table class="shoptbl"><thead><tr><th>Artikel</th><th class="num">Standard</th><th>Preis</th><th>Rabatt</th><th class="num">Im Spiel</th><th title="Abzeichen NEU">Neu</th><th title="Im Shop ausblenden – wer ihn schon hat, behält ihn">Aus</th></tr></thead><tbody>${list.map(row).join('')}</tbody></table></div></div>`).join('')}
    <div class="card"><h3>💳 Kaufpakete (Echtgeld)</h3><p class="small muted" style="margin:0 0 8px">Preise legst du in Google Play / App Store fest. Hier: ausblenden und Hinweis-Etikett (z. B. „Bester Wert“). Inhalt und Münzmenge sind fest – sie stehen so in den Store-Beschreibungen.</p>
      <div class="tblwrap"><table><thead><tr><th>Paket</th><th>Inhalt</th><th>Etikett</th><th>Aus</th></tr></thead><tbody>${d.packs.map(p => { const o = PK[p.id] || {}; return `<tr data-pk="${p.id}"><td><code>${esc(p.id)}</code></td><td>${fmt(p.coins)} Münzen${p.once ? ' + Krone + 3 Kopfstarts' : ''}</td><td><input type="text" class="pt" maxlength="24" value="${esc(o.tag || '')}" placeholder="${esc(p.tag || '–')}"></td><td><input type="checkbox" class="ph" ${o.hidden ? 'checked' : ''}></td></tr>`; }).join('')}</tbody></table></div></div>
    <div class="savebar"><span class="small grow" id="shmsg"></span><button class="btn w" id="shreset">Alles auf Standard</button><button class="btn" id="shsave">Speichern</button></div>`;
  const eff = tr => { const base = +tr.querySelector('.sp').placeholder, p = +tr.querySelector('.sp').value || base, own = +tr.querySelector('.ss').value || 0, g = +$('sl-pct').value || 0, pct = own || g;
    const v = pct ? Math.max(10, Math.round(p * (1 - pct / 100) / 10) * 10) : p; tr.querySelector('.eff').innerHTML = (v !== base ? `<s class="muted">${fmt(base)}</s> ` : '') + `<b>${fmt(v)}</b>`; tr.classList.toggle('off', tr.querySelector('.sh').checked); };
  const all = () => $('main').querySelectorAll('tr[data-id]').forEach(eff);
  $('main').addEventListener('input', all); $('main').addEventListener('change', all); all();
  const ts = id => { const v = $(id).value; return v ? new Date(v).getTime() : undefined; };
  $('shsave').onclick = async () => {
    $('main').querySelectorAll('.ferr').forEach(x => x.classList.remove('ferr'));
    let bad = false;
    for (const i of $('main').querySelectorAll('input[type=number]')) if (i.value !== '' && (+i.value < +i.min || +i.value > +i.max || !Number.isInteger(+i.value))) { i.classList.add('ferr'); bad = true; }
    if (bad) return toast('Rot markierte Werte liegen außerhalb der erlaubten Grenzen.', true);
    const items = {};
    $('main').querySelectorAll('tr[data-id]').forEach(tr => { const o = {}, p = tr.querySelector('.sp').value, sa = tr.querySelector('.ss').value;
      if (p !== '') o.price = +p; if (sa !== '' && +sa > 0) o.sale = +sa; if (tr.querySelector('.sh').checked) o.hidden = true; if (tr.querySelector('.sn').checked) o.isNew = true;
      if (Object.keys(o).length) items[tr.dataset.id] = o; });
    const packs = {};
    $('main').querySelectorAll('tr[data-pk]').forEach(tr => { const o = {}, t = tr.querySelector('.pt').value.trim(); if (t) o.tag = t; if (tr.querySelector('.ph').checked) o.hidden = true; if (Object.keys(o).length) packs[tr.dataset.pk] = o; });
    const shop = { items, packs, sale: { pct: +$('sl-pct').value || 0, from: ts('sl-from'), until: ts('sl-until') } };
    $('shsave').disabled = true;
    try { await api('', { action: 'shop', shop }); toast('✓ Gespeichert – gilt beim nächsten Spielstart'); $('shmsg').textContent = 'Gespeichert ' + dt(Date.now()); }
    catch (e) { toast('Ging nicht: ' + ((e.j && e.j.fields) || [e.message]).join(', '), true); }
    $('shsave').disabled = false;
  };
  $('shreset').onclick = async () => {
    if (!confirm('Alle Shop-Anpassungen löschen? Dann gelten wieder die Standardpreise, alles ist sichtbar und keine Rabattaktion läuft.')) return;
    try { await api('', { action: 'shop', shop: {} }); toast('✓ Zurückgesetzt'); vShop(); } catch (e) { toast('Ging nicht: ' + e.message, true); }
  };
}

// ---------- Protokoll ----------
async function vLog() {
  const { log } = await api('?view=log');
  const A = { login: '🔓 Anmeldung', 'login-fail': '⛔ Fehlversuch', 'logout-all': 'Alle abgemeldet', ban: '🚫 Gesperrt', unban: 'Entsperrt', unboard: 'Aus Rangliste', rename: 'Umbenannt', height: 'Rekord', levels: 'Stufen', config: '⚙️ Einstellungen', 'unlink-google': '🔐 Google getrennt' };
  $('main').innerHTML = `<h2>Protokoll</h2><p class="muted">Alles, was in der Zentrale passiert ist – mit Grund. Anschluss nur als Kürzel.</p>
    <div class="card"><div class="wrap">${log.length ? `<table><tr><th>Wann</th><th>Was</th><th>Spieler</th><th>Details</th><th class="hide-s">Anschluss</th></tr>${log.map(l => `<tr><td class="small muted">${dt(l.at)}</td><td>${A[l.a] || (l.a.startsWith('op:') ? '✏️ ' + esc(l.a.slice(3)) : esc(l.a))}</td><td>${l.u ? nameCell(l.n, null, l.u) : ''}</td><td class="small">${esc(l.d)}</td><td class="hide-s small muted">${esc(l.ip)}</td></tr>`).join('')}</table>` : '<p class="empty">Noch leer.</p>'}</div></div>`;
}

// ---------- Sicherheit ----------
async function vSec() {
  const s = await api('?view=security');
  $('main').innerHTML = `<h2>Sicherheit</h2>
    <div class="grid">
      <div class="card"><h3>Regeln</h3><ul class="small" style="margin:0;padding-left:18px">
        <li>Anmeldung nur mit dem Zentrale-Schlüssel (${s.keyLength} Zeichen). Der Schlüssel wird nicht im Browser gespeichert.</li>
        <li>3 falsche Versuche → dieser Anschluss 1 Stunde gesperrt, beim nächsten Mal 24 Stunden.</li>
        <li>10 falsche Versuche insgesamt in 24 Stunden → Anmeldung für alle 1 Stunde gesperrt.</li>
        <li>Sitzungen enden nach 8 Stunden oder beim Schließen des Tabs.</li>
        <li>Neuer Schlüssel: im Projektordner <b>SKY-RUSH-ZENTRALE-SCHLUESSEL.bat</b> starten (stellt ihn auch gleich online) – alle Sitzungen und Sperren sind damit weg.</li></ul></div>
      <div class="card"><h3>Fehlversuche</h3><p>Letzte 24 Std: <b>${s.global.fails24h}</b> / ${s.rules.globalTries}${s.global.until ? ` · <span class="badge bad">Anmeldung gesperrt bis ${dt(s.global.until)}</span>` : ''}</p>
        ${s.locks.length ? `<table><tr><th>Anschluss</th><th>Fehlversuche</th><th>Gesperrt bis</th></tr>${s.locks.map(l => `<tr><td class="small">${esc(l.ip)}</td><td>${l.fails}</td><td>${l.until ? dt(l.until) : '–'}</td></tr>`).join('')}</table>` : '<p class="muted">Keine Sperren.</p>'}</div>
      <div class="card"><h3>Angemeldet (${s.sessions.length})</h3>${s.sessions.length ? `<table>${s.sessions.map(x => `<tr><td class="small">${dt(x.at)}</td><td class="small muted">${esc(x.ip)}</td><td class="small muted hide-s">${esc((x.ua || '').slice(0, 60))}</td></tr>`).join('')}</table>` : ''}
        <button class="btn r" id="lall" style="margin-top:10px">Alle Sitzungen abmelden</button></div>
    </div>`;
  $('lall').onclick = async () => { if (!confirm('Alle Sitzungen (auch diese) abmelden?')) return; try { await api('', { action: 'logoutAll' }); } catch {} showLogin('Alle Sitzungen abgemeldet.'); };
}

addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== VIEW && !$('app').hidden) go(v); });
if (TOKEN) { $('login').hidden = true; $('app').hidden = false; go(location.hash.slice(1) || 'dash'); } else showLogin();
</script>
</body>
</html>
